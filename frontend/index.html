<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent 聊天</title>
<!--
  单文件前端，零依赖零构建。
  契约（README 第 3 节）：
    请求：POST http://localhost:3000/api/chat
          body: { "messages": [ { "role": "user", "content": "..." } ] }
    响应：SSE，每条 data: {"delta": "增量文字"}，结束 data: [DONE]
  当前处于 MOCK_MODE（假流式），接口通了把 MOCK_MODE 改成 false 即可。
-->
<style>
  /* ---------- 全局：浅色、极简，手机也能用 ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 20px;
    background: #ffffff;
    border-bottom: 1px solid #e5e6eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status {
    font-size: 12px;
    color: #86909c;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffb400; /* 黄：mock 模式 */
  }
  #status.real .dot { background: #00b42a; } /* 绿：真接口 */

  /* ---------- 消息区 ---------- */
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 76%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;      /* 保留换行，但先不做 markdown 渲染 */
    word-break: break-word;
    position: relative;
  }
  .row.user .bubble {
    background: #1f6feb;
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: #ffffff;
    color: #1f2329;
    border: 1px solid #e5e6eb;
    border-bottom-left-radius: 4px;
  }
  /* 出错时整颗气泡变红，避免用户把错误当成正常回复（原来只加了 class 没有样式） */
  .row.assistant .bubble.error {
    background: #fff2f0;
    border-color: #ffccc7;
    color: #a8071a;
  }
  /* 流式光标：assistant 正在"打字"时显示 ▍ */
  .bubble.streaming::after {
    content: "▍";
    margin-left: 2px;
    animation: blink 1s steps(2) infinite;
    color: #86909c;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 输入区 ---------- */
  footer {
    flex: 0 0 auto;
    padding: 12px 20px 18px;
    background: #ffffff;
    border-top: 1px solid #e5e6eb;
  }
  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 900px;
    margin: 0 auto;
  }
  #input {
    flex: 1 1 auto;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    padding: 11px 14px;
    border: 1px solid #d0d3d9;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: #1f6feb; }
  #send {
    flex: 0 0 auto;
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: #1f6feb;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #send:hover:not(:disabled) { background: #1557b8; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint {
    max-width: 900px;
    margin: 8px auto 0;
    font-size: 12px;
    color: #86909c;
    text-align: center;
  }

  /* ---------- 滚动条（可选优化） ---------- */
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: #d0d3d9; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>AI Agent 聊天</h1>
  <div id="status"><span class="dot"></span><span id="statusText">Mock 模式</span></div>
</header>

<main id="messages"></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">教学项目 · 前端零依赖单文件 · 密钥只在后端 .env</div>
</footer>

<script>
/* =========================================================
   全局配置
   ========================================================= */
const API_URL = "http://localhost:3000/api/chat";
// 开关：true = 本地假流式；false = 走真后端 SSE。
// 后端 server.js 一通，把这里改成 false 即可，其它代码不用动。
const MOCK_MODE = true;

/* =========================================================
   DOM 引用
   ========================================================= */
const $messages  = document.getElementById("messages");
const $input     = document.getElementById("input");
const $send      = document.getElementById("send");
const $statusText = document.getElementById("statusText");
const $status    = document.getElementById("status");

/* =========================================================
   多轮记忆：前端维护完整对话历史
   每次请求把整个 messages 数组发给后端（契约第 1 条）
   ========================================================= */
const history = []; // [{ role: "user"|"assistant", content: "..." }]
let busy = false;   // 流式进行中标志：按钮 disabled 挡不住键盘 Enter，必须自己拦

/* =========================================================
   UI：往消息区追加一个气泡
   role: "user" | "assistant" | "error"
   返回气泡 DOM，方便流式往里喂字
   ========================================================= */
function appendBubble(role, text = "") {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "assistant");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  $messages.appendChild(row);
  scrollToBottom();
  return bubble;
}

function scrollToBottom() {
  $messages.scrollTop = $messages.scrollHeight;
}

/* =========================================================
   发送流程：
   1. 取输入 → 入 history → 画用户气泡
   2. 画一个空的 assistant 气泡
   3. 调 streamReply() 往里喂字
   4. 结束后把完整回复也入 history
   ========================================================= */
async function sendMessage() {
  if (busy) return;               // 上一轮还在流式输出，忽略这次发送（防并发）
  const text = $input.value.trim();
  if (!text) return;

  busy = true;
  $input.value = "";
  autoResize();
  $send.disabled = true;

  history.push({ role: "user", content: text });
  appendBubble("user", text);

  const bubble = appendBubble("assistant", "");
  bubble.classList.add("streaming");

  let full = "";
  try {
    full = await streamReply(history, (delta) => {
      // 每收到一段增量，就往气泡里追加
      bubble.textContent += delta;
      scrollToBottom();
    });
  } catch (err) {
    bubble.textContent += "\n[出错] " + (err && err.message ? err.message : err);
    bubble.classList.remove("streaming");
    bubble.classList.add("error");
    busy = false;
    $send.disabled = false;
    return;
  }

  bubble.classList.remove("streaming");
  if (full) history.push({ role: "assistant", content: full });
  busy = false;
  $send.disabled = false;
  $input.focus();
}

/* =========================================================
   streamReply：核心分发
   - MOCK_MODE=true  → mockStream()，本地喂字
   - MOCK_MODE=false → realStream()，fetch SSE
   两者都通过 onDelta 回调把增量交给调用方
   返回完整文本
   ========================================================= */
async function streamReply(messages, onDelta) {
  if (MOCK_MODE) return mockStream(messages, onDelta);
  return realStream(messages, onDelta);
}

/* =========================================================
   假流式：模拟 SSE 的视觉节奏
   现在是把一句假回复按 30ms/字喂进气泡。
   注意：这里没有任何网络请求，纯本地，便于先做视觉和交互。
   ========================================================= */
function mockStream(messages, onDelta) {
  const lastUser = [...messages].reverse().find((m) => m.role === "user");
  const fakeText =
    "（Mock 模式）我收到了你的消息：" +
    (lastUser ? lastUser.content : "") +
    "。\n\n这是前端假流式的演示——文字会按 SSE 的节奏逐段出现。" +
    "等后端 /api/chat 通了，把 MOCK_MODE 改成 false 就是真流式了。";

  return new Promise((resolve) => {
    let i = 0;
    const timer = setInterval(() => {
      if (i >= fakeText.length) {
        clearInterval(timer);
        resolve(fakeText);
        return;
      }
      // 每次喂 1 个字，节奏像"打字机"
      onDelta(fakeText[i]);
      i += 1;
    }, 30);
  });
}

/* =========================================================
   真流式：fetch + ReadableStream 解析 SSE
   协议：每条 "data: {...}" 是一行，空行分隔；
         结束是 "data: [DONE]"。
   返回完整拼接文本
   ========================================================= */
async function realStream(messages, onDelta) {
  // 60 秒内连响应头都拿不到就中止：避免后端卡死时发送按钮永久禁用、只能刷新
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);
  let resp;
  try {
    resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
      signal: controller.signal,
    });
  } finally {
    clearTimeout(timer);   // 已拿到响应头，之后是流式读取，不再受这个超时约束
  }

  if (!resp.ok) {
    throw new Error("HTTP " + resp.status);
  }
  if (!resp.body) {
    throw new Error("响应无 body，浏览器可能不支持流式");
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";   // 未处理完的残行
  let full = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE 以 \n\n 分隔事件块；这里逐块切
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const chunk = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);

      // 一个块里可能有多行 data:
      const lines = chunk.split("\n");
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") return full;
        try {
          const obj = JSON.parse(payload);
          if (typeof obj.delta === "string") {
            full += obj.delta;
            onDelta(obj.delta);
          }
        } catch (_) {
          // 非 JSON 的 data 行，忽略（比如心跳）
        }
      }
    }
  }

  // 流结束时 buffer 里可能还剩最后一段没遇到空行分隔符，这里补解析一次，避免丢字
  if (buffer.trim()) {
    for (const line of buffer.split("\n")) {
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      try {
        const obj = JSON.parse(payload);
        if (typeof obj.delta === "string") { full += obj.delta; onDelta(obj.delta); }
      } catch (_) {
        // 忽略非 JSON 尾行
      }
    }
  }
  return full;
}

/* =========================================================
   输入框自适应高度 + 快捷键
   Enter 发送，Shift+Enter 换行
   ========================================================= */
function autoResize() {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 160) + "px";
}

$input.addEventListener("input", autoResize);
$input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
$send.addEventListener("click", sendMessage);

/* =========================================================
   初始化：标出当前模式
   ========================================================= */
if (MOCK_MODE) {
  $statusText.textContent = "Mock 模式";
} else {
  $statusText.textContent = "已连接";
  $status.classList.add("real");
}

// 开场一条欢迎，避免空白
appendBubble(
  "assistant",
  "你好，我是前端页面。当前是 Mock 模式，后端接口一通就会切真流式。\n试着发一条消息吧。"
);
</script>
</body>
</html>
